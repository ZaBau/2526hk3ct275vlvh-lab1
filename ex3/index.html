```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3 - Biểu mẫu Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/all.min.css">
</head>

<body class="bg-light">

<div class="container py-5">

    <h1 class="text-center mb-5">Bài 3 - Biểu mẫu đăng nhập</h1>

    <section class="mb-5">
        <h4 class="mb-3">1. Biểu mẫu đăng nhập ngang</h4>

        <div class="card mx-auto border-info" style="max-width: 600px;">
            <div class="card-header bg-info-subtle text-info-emphasis">
                <i class="fa-solid fa-lock me-2"></i>Biểu mẫu đăng nhập
            </div>

            <div class="card-body">
                <form>
                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">Email:</label>
                        <div class="col-sm-9">
                            <input type="email" class="form-control"
                                   placeholder="Nhập vào email">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">Mật khẩu:</label>
                        <div class="col-sm-9">
                            <input type="password" class="form-control"
                                   placeholder="Nhập vào mật khẩu">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="offset-sm-3 col-sm-9">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input"
                                       id="remember1">
                                <label class="form-check-label" for="remember1">
                                    Ghi nhớ tôi
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="offset-sm-3 col-sm-9">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-right-to-bracket me-2"></i>
                                Đăng nhập
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <section class="mb-5">
        <h4 class="mb-3">2. Biểu mẫu đăng nhập đứng</h4>

        <div class="card mx-auto border-info" style="max-width: 600px;">
            <div class="card-header bg-info-subtle text-info-emphasis">
                <i class="fa-solid fa-user me-2"></i>Đăng nhập tài khoản
            </div>

            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <label for="email2" class="form-label">Email:</label>
                        <input type="email" id="email2" class="form-control"
                               placeholder="Nhập vào email">
                    </div>

                    <div class="mb-3">
                        <label for="password2" class="form-label">Mật khẩu:</label>
                        <input type="password" id="password2" class="form-control"
                               placeholder="Nhập vào mật khẩu">
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input"
                               id="remember2">
                        <label class="form-check-label" for="remember2">
                            Ghi nhớ tôi
                        </label>
                    </div>

                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>
                        Đăng nhập
                    </button>
                </form>
            </div>
        </div>
    </section>

    <section class="mb-5">
        <h4 class="mb-3">3. Biểu mẫu đăng nhập một dòng</h4>

        <div class="card">
            <div class="card-body">
                <form class="row g-3 align-items-center">
                    <div class="col-12 col-md-4">
                        <input type="email" class="form-control"
                               placeholder="Email">
                    </div>

                    <div class="col-12 col-md-4">
                        <input type="password" class="form-control"
                               placeholder="Mật khẩu">
                    </div>

                    <div class="col-6 col-md-2">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input"
                                   id="remember3">
                            <label class="form-check-label" for="remember3">
                                Ghi nhớ
                            </label>
                        </div>
                    </div>

                    <div class="col-6 col-md-2">
                        <button type="submit" class="btn btn-primary w-100">
                            Đăng nhập
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <section class="mb-4">
        <h4 class="mb-3">4. Biểu mẫu đăng nhập bằng Modal</h4>

        <button type="button" class="btn btn-warning"
                data-bs-toggle="modal" data-bs-target="#loginModal">
            <i class="fa-solid fa-window-maximize me-2"></i>
            Mở hộp thoại đăng nhập
        </button>
    </section>

</div>

<div class="modal fade" id="loginModal" tabindex="-1"
     aria-labelledby="loginModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="loginModalLabel">
                    <i class="fa-solid fa-user-lock me-2"></i>
                    Biểu mẫu đăng nhập
                </h5>

                <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>

            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label for="email4" class="form-label">Email:</label>
                        <input type="email" id="email4" class="form-control"
                               placeholder="Nhập vào email">
                    </div>

                    <div class="mb-3">
                        <label for="password4" class="form-label">Mật khẩu:</label>
                        <input type="password" id="password4" class="form-control"
                               placeholder="Nhập vào mật khẩu">
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input"
                               id="remember4">
                        <label class="form-check-label" for="remember4">
                            Ghi nhớ tôi
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>
                        Đăng nhập
                    </button>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                    Hủy bỏ
                </button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
